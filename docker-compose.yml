services:

  api:
    image: your-dockerhub-username/fraud-api:latest
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    expose:
      - "8000"
    deploy:
      replicas: 2
    networks:
      - fraud-network

  dashboard:
    image: your-dockerhub-username/fraud-dashboard:latest
    restart: unless-stopped
    environment:
      - API_URL=http://nginx:80
    depends_on:
      - api
    ports:
      - "8501:8501"
    networks:
      - fraud-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fraud-network

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    networks:
      - fraud-network

networks:
  fraud-network:
    driver: overlay

volumes:
  redis_data:

configs:
  nginx_config:
    file: ./nginx/nginx.conf