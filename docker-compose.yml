services:

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./model:/app/model
      - ./data:/app/data
    expose:
      - "8000"
    deploy:
      replicas: 2
    networks:
      - fraud-network

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    container_name: fraud-dashboard
    restart: unless-stopped
    environment:
      - API_URL=http://nginx:80
    depends_on:
      - api
    ports:
      - "8501:8501"
    networks:
      - fraud-network

  redis:
    image: redis:7-alpine
    container_name: fraud-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fraud-network

  nginx:
    image: nginx:stable-alpine
    container_name: fraud-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - fraud-network

networks:
  fraud-network:
    driver: bridge

volumes:
  redis_data: